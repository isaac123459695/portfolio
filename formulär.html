<!DOCTYPE html>
<html lang="sv">
<Head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulär</title>
    <link rel="stylesheet" href="style.css">
</Head>

<body>
    <nav class="navbar">
        <a href="Index.html">Hem</a>
        <a href="kontakter.html">Kontakter</a>
        <a href="formulär.html">Formulär</a>
    </nav>

    <div class="container">
        <h1>Kontakta oss</h1>
        <form id="contactForm">
            <label for="email">E-post:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="message">Meddelande:</label>
            <textarea id="message" name="message" minlength="10" required></textarea>
            
            <button type="submit">Skicka</button>
        </form>
        <p id="errorMessage" style="color: red; display: none;">Vänligen fyll i alla fält korrekt.</p>
    </div>

    <script src="form.js"></script>
</body>
</html>
